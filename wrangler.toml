name = "ww-proxy"
main = "src/index.ts"
compatibility_date = "2024-11-27"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

# Static assets (og-image, apple-touch-icon) served directly by Cloudflare's
# edge cache. Requests to paths matching files under `./public` are served
# from the edge; unmatched paths fall through to the worker (default
# behavior when `main` is set and `not_found_handling` is omitted).
[assets]
directory = "./public"
binding = "ASSETS"

[[routes]]
pattern = "ww-proxy.leviwilkerson.com"
custom_domain = true

[vars]
APP_VERSION = "dev"
COMMIT_SHA = "local"
# iOS bundle id — part of the App Attest app id (`<APPLE_TEAM_ID>.<IOS_BUNDLE_ID>`).
IOS_BUNDLE_ID = "com.leviwilkerson.jwtime"
# RevenueCat entitlement that denotes a Supporter (server-side check).
REVENUECAT_ENTITLEMENT_ID = "Supporter"
# Notes Import knobs — all optional; see src/notesImport/config.ts for defaults.
# NOTES_IMPORT_MODEL = "deepseek/deepseek-v4-flash"
# NOTES_IMPORT_PROVIDERS = "fireworks,deepinfra,baseten,azure"
# NOTES_IMPORT_MAX_CHARS = "100000"
# NOTES_IMPORT_MAX_OUTPUT_TOKENS = "16000"
# NOTES_IMPORT_FREE_CREDITS = "5"
# NOTES_IMPORT_MAX_REFINEMENTS = "5"

# Notes Import metadata store (challenges, device keys, usage counters). Holds
# NO notes text or model output (ADR 0008). Create with:
#   wrangler kv namespace create NOTES_KV
# then paste the printed id below.
[[kv_namespaces]]
binding = "NOTES_KV"
id = "REPLACE_WITH_NOTES_KV_NAMESPACE_ID"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 60
  period = 60

[observability]
enabled = true
head_sampling_rate = 1 # optional. default = 1.
logs.persist = true

# Secrets should be set via:
# wrangler secret put HERE_API_KEY
# wrangler secret put SENTRY_DSN
# wrangler secret put AI_GATEWAY_API_KEY        # Vercel AI Gateway key (ZDR host)
# wrangler secret put REVENUECAT_API_KEY        # RevenueCat REST v1 secret (sk_...)
# wrangler secret put NOTES_IMPORT_DEV_BYPASS_TOKEN   # DEV/STAGING worker only — never prod
